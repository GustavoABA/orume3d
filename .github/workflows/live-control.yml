name: Controlar live no site

on:
  workflow_dispatch:
    inputs:
      status:
        description: Mostrar ou esconder a live
        required: true
        type: choice
        options:
          - ligada
          - desligada
      youtube_url:
        description: Link da transmissão do YouTube (obrigatório ao ligar pela primeira vez)
        required: false
        type: string
      titulo:
        description: Título curto que aparecerá no site (opcional)
        required: false
        default: Impressão ao vivo.
        type: string

permissions:
  contents: write

jobs:
  atualizar:
    runs-on: ubuntu-latest
    steps:
      - name: Baixar o projeto
        uses: actions/checkout@v4

      - name: Atualizar o estado da live
        env:
          LIVE_STATUS: ${{ inputs.status }}
          YOUTUBE_URL: ${{ inputs.youtube_url }}
          LIVE_TITLE: ${{ inputs.titulo }}
        run: node scripts/set-live.mjs --status "$LIVE_STATUS" --url "$YOUTUBE_URL" --title "$LIVE_TITLE"

      - name: Salvar a alteração
        run: |
          git config user.name "Orume 3D Live"
          git config user.email "actions@users.noreply.github.com"
          git add public/live.json
          if git diff --cached --quiet; then
            echo "Nenhuma alteração necessária."
          else
            git commit -m "Atualiza transmissão ao vivo"
            git push
          fi
